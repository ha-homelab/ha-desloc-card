<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title description">
<title id="title">One card. Your language.</title>
<desc id="description">An optional per-card language overrides the Home Assistant profile. Regional tags map to a bundled pack; unsupported languages use English. Arabic, Hebrew and Persian render right to left. Names and entity IDs remain literal. Changing language never sends lock commands.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f3f7ff"/><stop offset="1" stop-color="#f5fbf8"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7789a0"/></marker></defs>
<rect width="720" height="980" rx="24" fill="url(#wash)"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<rect x="32" y="29" width="42" height="5" rx="2" fill="#007f7a" stroke="none"/>
<text x="86" y="37" font-size="13" font-weight="700" fill="#007f7a" text-anchor="start" letter-spacing="1.5">LANGUAGE SELECTION</text>
<text x="32" y="87" font-size="31" font-weight="750" fill="#14263d" text-anchor="start" letter-spacing="0">One card. Your language.</text>
<text x="32" y="121" font-size="18" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">Local dictionaries, regional fallback and RTL layout.</text>
<rect x="32" y="158" width="316" height="119" rx="18" fill="#f1ebfa" stroke="none"/>
<rect x="372" y="158" width="316" height="119" rx="18" fill="#eaf0ff" stroke="none"/>
<text x="56" y="194" font-size="22" font-weight="700" fill="#7145b7" text-anchor="start" letter-spacing="0">Per-card language</text>
<text x="56" y="227" font-size="18" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">Use an explicit override</text>
<text x="56" y="253" font-size="18" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">when one is configured.</text>
<text x="396" y="194" font-size="22" font-weight="700" fill="#245edb" text-anchor="start" letter-spacing="0">HA profile language</text>
<text x="396" y="227" font-size="18" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">Otherwise follow the</text>
<text x="396" y="253" font-size="18" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">Home Assistant profile.</text>
<path d="M 190 280 V 314 H 360 V 346" fill="none" stroke="#7789a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 530 280 V 314 H 360" fill="none" stroke="#7789a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="358" width="624" height="105" rx="18" fill="#fff" stroke="#dbe4ee"/>
<rect x="48" y="377" width="5" height="67" rx="2" fill="#007f7a" stroke="none"/>
<text x="72" y="392" font-size="22" font-weight="700" fill="#007f7a" text-anchor="start" letter-spacing="0">Normalize the regional tag</text>
<text x="72" y="422" font-size="19" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">fr-CA → fr · pt-BR → pt · zh-TW → zh-Hant</text>
<path d="M 360 466 V 504" fill="none" stroke="#7789a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="516" width="624" height="105" rx="18" fill="#fff" stroke="#dbe4ee"/>
<rect x="48" y="535" width="5" height="67" rx="2" fill="#7145b7" stroke="none"/>
<text x="72" y="550" font-size="22" font-weight="700" fill="#7145b7" text-anchor="start" letter-spacing="0">Pick a bundled language pack</text>
<text x="72" y="580" font-size="19" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">24 complete packs; unsupported locales use English.</text>
<path d="M 360 624 V 662" fill="none" stroke="#7789a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="674" width="624" height="124" rx="18" fill="#fff" stroke="#dbe4ee"/>
<rect x="48" y="693" width="5" height="86" rx="2" fill="#245edb" stroke="none"/>
<text x="72" y="708" font-size="22" font-weight="700" fill="#245edb" text-anchor="start" letter-spacing="0">Render text and direction</text>
<text x="72" y="738" font-size="19" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">RTL: Arabic, Hebrew and Persian.</text>
<text x="72" y="764" font-size="19" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">User names and entity IDs remain literal.</text>
<rect x="48" y="837" width="624" height="78" rx="18" fill="#eaf5eb" stroke="none"/>
<text x="360" y="882" font-size="22" font-weight="650" fill="#237447" text-anchor="middle" letter-spacing="0">Language changes never send commands.</text>
<text x="32" y="932" font-size="16" font-weight="400" fill="#43566f" text-anchor="start" letter-spacing="0">No extra resource files or translation-service requests.</text>
</g>
</svg>

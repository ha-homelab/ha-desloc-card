name: Checks
on:
  workflow_call:

permissions:
  contents: read
jobs:
  browser-compatibility:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/typescript-ci.yml@b071472a0d83cc8d049c4df00451bc291a7c1571
    with:
      node-version: '24'
      run-node-ci: false
      browser-matrix-file: .github/browser-compatibility.json
      browser-prepare-command: npm ci --ignore-scripts
      browser-test-command: node scripts/browser-acceptance.cjs
      browser-extended: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow validation dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.txt
      - name: Check atomic CodeQL updates
        run: |
          .venv-ci/bin/python -m unittest discover -s scripts -p 'test_ci_actions.py'
          .venv-ci/bin/python scripts/check_ci_actions.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Replay deterministic fuzz target contracts
        run: |
          npm ci --prefix fuzz --ignore-scripts --no-audit --no-fund
          node fuzz/replay.mjs
      - run: python3 scripts/test_package_card.py
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin
